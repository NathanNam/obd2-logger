name: OBD2Logger
options:
  bundleIdPrefix: com.nathannam
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    DEVELOPMENT_TEAM: 794FX757KP
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
targets:
  OBD2Logger:
    type: application
    platform: iOS
    sources:
      - path: OBD2Logger
        excludes:
          - "Info.plist"
      # Bundle the JSON profile files from the web source so both apps share
      # one source of truth. xcodegen adds them to the resources phase.
      - path: ../src/profiles/builtin
        name: Profiles
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nathannam.obd2logger
        PRODUCT_NAME: OBD2 Logger
        INFOPLIST_FILE: OBD2Logger/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: '"OBD2Logger/Preview Content"'
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1"  # iPhone only — UI is portrait-only and tuned for phone widths
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
schemes:
  OBD2Logger:
    build:
      targets:
        OBD2Logger: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
